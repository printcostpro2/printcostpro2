name: Diagnose PrintCost Pro live UI

on:
  push:
    branches:
      - diagnose-ui-20261120

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish a candidate version to an isolated preview channel
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRINTCOSTPRO2_B0737 }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          npx --yes firebase-tools@15.37.0 hosting:clone \
            printcostpro2-b0737@aff9b7c6c1fb3b10 \
            printcostpro2-b0737:repaircheck20112026 \
            --project printcostpro2-b0737 \
            --non-interactive
      - name: Download the live application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          curl --fail --silent --show-error --location --retry 3 \
            "https://printcostpro2-b0737--repaircheck20112026-j4ljci1w.web.app/index.html?diagnostic=$(date +%s)" \
            --output diagnostic/index.html
          test "$(wc -c < diagnostic/index.html)" -gt 100000
          echo "HTML_BYTES=$(wc -c < diagnostic/index.html)"
          sha256sum diagnostic/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic/index.html
          git commit -m "Capture fixed live HTML for repair analysis [skip ci]" || true
          git push origin HEAD:diagnose-ui-20261120
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic/index.html
          git commit -m "Capture live HTML for repair analysis [skip ci]" || true
          git push origin HEAD:diagnose-ui-20261120

      - name: Validate all inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.items=[]; self.current=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current={"attrs":dict(attrs),"chunks":[]}
              def handle_data(self, data):
                  if self.current is not None: self.current["chunks"].append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current is not None:
                      self.items.append(self.current); self.current=None
          p=Extract(); p.feed(Path("diagnostic/index.html").read_text(encoding="utf-8"))
          n=0
          for i,s in enumerate(p.items):
              typ=(s["attrs"].get("type") or "").lower()
              if s["attrs"].get("src") or typ in ("application/json","application/ld+json","application/manifest+json","importmap"):
                  continue
              n+=1
              Path(f"diagnostic/inline-{i:03}.js").write_text("".join(s["chunks"]),encoding="utf-8")
          print(f"INLINE_JS_COUNT={n}")
          print(f"ALL_SCRIPT_TAGS={len(p.items)}")
          for i,s in enumerate(p.items):
              if not s["attrs"].get("src"):
                  content="".join(s["chunks"])
                  attrs=s["attrs"]
                  print("INLINE_TAG", i, "ID=", attrs.get("id", ""), "TYPE=", attrs.get("type", ""), "LEN=", len(content), "END=", repr(content[-100:]))
          PY
          failed=0
          for f in diagnostic/inline-*.js; do
            [ -e "$f" ] || continue
            if ! node --check "$f" > /tmp/node-check.out 2>&1; then
              echo "SYNTAX_ERROR_IN=$f"
              cat /tmp/node-check.out
              line=$(grep -oE "inline-[0-9]+\\.js:[0-9]+" /tmp/node-check.out | head -1 | cut -d: -f2 || true)
              if [ -n "$line" ]; then start=$((line-15)); end=$((line+8)); sed -n "${start},${end}p" "$f"; fi
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            npm install --no-save acorn@8 >/dev/null
            node diagnostic/scan.js
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All inline JavaScript scripts passed node --check."

      - name: Install browser test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Test live page loading and inspect interactive controls
        shell: bash
        run: |
          set -euo pipefail
          cat > diagnostic/check.cjs <<'JS'
          const { chromium } = require('playwright');
          const crypto = require('crypto');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({viewport:{width:1600,height:1100}});
            const page = await context.newPage();
            const testPassword = 'PrintCost-Test-2026';
            const salt = 'automated-browser-test';
            const hash = crypto.createHash('sha256').update(salt + ':' + testPassword).digest('hex');
            await page.addInitScript(({salt,hash}) => {
              localStorage.setItem('printcost_app_access_v1', JSON.stringify({salt,hash,version:1}));
            }, {salt,hash});
            const pageErrors = [], consoleErrors = [], failedRequests = [], badResponses = [];
            page.on('pageerror', e => pageErrors.push(String(e.stack || e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => failedRequests.push({url:r.url(),error:r.failure()?.errorText}));
            page.on('response', r => { if (r.status() >= 400) badResponses.push({status:r.status(),url:r.url()}); });
            const response = await page.goto('https://printcostpro2-b0737--repaircheck20112026-j4ljci1w.web.app/index.html?pwtest=' + Date.now(), {waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(7000);
            const initial = await page.evaluate(() => ({
              title: document.title,
              dashboardVisible: !document.getElementById('view-dashboard')?.classList.contains('hidden'),
              locked: !document.getElementById('app-lock-screen')?.classList.contains('hidden'),
              printerCount: (() => { try { return JSON.parse(localStorage.getItem('printcost_printers') || '[]').length; } catch(e) { return -1; } })(),
              defaultCatalogCount: (document.querySelectorAll('#catalog-grid > *').length)
            }));
            console.log('HTTP_STATUS=' + response?.status());
            console.log('INITIAL=' + JSON.stringify(initial));
            if (response?.status() !== 200) throw new Error('La página de prueba no devuelve HTTP 200.');
            if (!initial.locked) throw new Error('No aparece el control de acceso de la aplicación.');
            if (initial.printerCount !== 36) throw new Error('No se han cargado los 36 modelos de impresora: ' + initial.printerCount);

            await page.locator('#app-unlock-password').fill(testPassword);
            await page.locator('#app-lock-screen button[type="submit"]').click();
            await page.waitForFunction(() => document.getElementById('app-lock-screen').classList.contains('hidden'), {timeout:10000});
            console.log('PASSWORD_GATE=OK');

            const views = [
              ['dashboard','nav-dashboard'],
              ['catalog','nav-catalog'],
              ['comparator','nav-comparator'],
              ['quotes','nav-quotes'],
              ['consumables','nav-consumables'],
              ['top10','nav-top10'],
              ['manualCalc','nav-manualCalc'],
              ['tcoSim','nav-tcoSim'],
              ['settings','nav-settings']
            ];
            const navResults = [];
            for (const [view,nav] of views) {
              await page.locator('#' + nav).click();
              await page.waitForTimeout(250);
              const state = await page.evaluate(view => {
                const el = document.getElementById('view-' + view);
                return {visible:!!el && !el.classList.contains('hidden'),text:(el?.innerText || '').trim().slice(0,160)};
              }, view);
              navResults.push({view,...state});
              if (!state.visible) throw new Error('No se puede abrir el apartado ' + view);
            }
            console.log('NAVIGATION=' + JSON.stringify(navResults));

            await page.locator('#nav-catalog').click();
            await page.waitForTimeout(400);
            const catalog = await page.evaluate(() => ({
              cards: document.querySelectorAll('#catalog-grid > *').length,
              text: (document.getElementById('catalog-grid')?.innerText || '').slice(0,500),
              addButton: [...document.querySelectorAll('button')].some(b => /Añadir Impresora|Nueva Impresora/i.test(b.innerText||b.textContent||''))
            }));
            console.log('CATALOG=' + JSON.stringify(catalog));
            if (catalog.cards < 30) throw new Error('El catálogo no muestra los 36 equipos. Tarjetas: ' + catalog.cards);

            await page.locator('button[onclick="openAddPrinterModal()"]').first().click();
            await page.waitForTimeout(200);
            const modalVisible = await page.locator('#printer-modal').evaluate(el => !el.classList.contains('hidden'));
            console.log('NEW_PRINTER_MODAL=' + modalVisible);
            if (!modalVisible) throw new Error('El botón Nueva Impresora no abre el formulario.');

            await page.locator('#printer-modal button').filter({hasText:/Cancelar|Cerrar/i}).first().click().catch(async () => {
              await page.keyboard.press('Escape');
            });
            const snapshot = await page.evaluate(() => ({
              visibleButtons: [...document.querySelectorAll('button')].filter(b => !!(b.offsetWidth || b.offsetHeight || b.getClientRects().length)).length,
              dashboardText: (document.getElementById('view-dashboard')?.innerText || '').slice(0,300),
              appPasswordHidden: document.getElementById('app-lock-screen')?.classList.contains('hidden')
            }));
            console.log('FINAL_SNAPSHOT=' + JSON.stringify(snapshot));
            console.log('PAGE_ERRORS=' + JSON.stringify(pageErrors));
            console.log('CONSOLE_ERRORS=' + JSON.stringify(consoleErrors.slice(0,60)));
            console.log('FAILED_REQUESTS=' + JSON.stringify(failedRequests.slice(0,60)));
            console.log('BAD_RESPONSES=' + JSON.stringify(badResponses.slice(0,60)));
            if (pageErrors.length) throw new Error('Se produjeron errores JavaScript durante las interacciones.');
            if (consoleErrors.length) throw new Error('La consola del navegador ha registrado errores.');
            await browser.close();
          })().catch(e=>{console.error('BROWSER_TEST_FAILED:',e);process.exit(3)});
          JS
          node diagnostic/check.cjs
