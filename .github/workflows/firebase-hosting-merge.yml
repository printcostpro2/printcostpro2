name: Deploy PrintCost Pro to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: printcostpro2-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate the tracked application source (no live-file patching)
        shell: bash
        run: |
          set -euo pipefail
          test -s y/index.html
          test "$(wc -c < y/index.html)" -gt 600000
          grep -q 'printcost-shared-anonymous-sync' y/index.html
          grep -q 'signInAnonymously' y/index.html
          grep -q "documentId == 'shared'" y/index.html
          grep -q 'printcost-minimal-firebase-settings-ui' y/index.html
          grep -q 'printcost-firebase-config-autorestore' y/index.html
          if grep -q 'id="cloud-email"' y/index.html || grep -q 'id="cloud-password"' y/index.html; then
            echo "Obsolete email/password sync controls found."
            exit 1
          fi
          test "$(grep -o '"id":"bsd2026-' y/index.html | wc -l)" -eq 36
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts=[]; self.current=None
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=="script":
                      self.current={"attrs":dict(attrs),"parts":[]}
              def handle_data(self, data):
                  if self.current is not None: self.current["parts"].append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=="script" and self.current is not None:
                      self.scripts.append(self.current); self.current=None
          parser=Extract(); parser.feed(Path("y/index.html").read_text(encoding="utf-8"))
          count=0
          for i, script in enumerate(parser.scripts):
              attrs=script["attrs"]; kind=(attrs.get("type") or "").lower()
              if attrs.get("src") or kind in ("application/json","application/ld+json","importmap"): continue
              Path(f"/tmp/printcost-{i:03}.js").write_text("".join(script["parts"]),encoding="utf-8")
              count+=1
          print(f"Inline JavaScript blocks: {count}")
          if count < 4: raise SystemExit("Unexpectedly few application scripts.")
          PY
          for f in /tmp/printcost-*.js; do node --check "$f"; done
          echo "Source verified: 36 printers, anonymous shared sync and all inline JS syntax valid."

      - name: Add the current privacy policy
        shell: bash
        run: |
          set -euo pipefail
          test -s politica_privacidad.html
          cp politica_privacidad.html y/politica-privacidad.html
          grep -qi "PrintCost Pro" y/politica-privacidad.html
          grep -qi "Firebase" y/politica-privacidad.html

      - name: Deploy the tracked source to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRINTCOSTPRO2_B0737 }}
          channelId: live
          projectId: printcostpro2-b0737
